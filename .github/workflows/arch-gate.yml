name: Architecture Gate

# 架构门禁：拦截 God File / God Object 复发。
# 2026-08-14 完成历史债务拆分（后端 9 个超标文件全部拆入包/mixin），
# 门禁升级为硬阻断：任何超过 800 行 / 30 类型的文件都会让 CI 失败。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  arch-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run architecture gate
        run: python scripts/arch_gate.py
